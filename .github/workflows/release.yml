name: release

# Publishes to npm with provenance when a v* tag is pushed.
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret is needed once the package
# is linked to this repository + workflow on npmjs.com (Package settings -> Trusted publishers).

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: check tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}" >&2
            exit 1
          fi
      - name: the judge is judged
        run: node dist/isitdone.js --json
      - name: publish to npm (skipped if this version already exists)
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "${NAME}@${VER} is already on npm; skipping publish"
          else
            npm publish --provenance --access public
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
